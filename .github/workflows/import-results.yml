name: Import World Cup Results

on:
  schedule:
    # Run every 5 minutes during World Cup (June 11 - July 19, 2026)
    - cron: '*/5 * 11-19 6 *'
    - cron: '*/5 * * 7 *'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger result import
        run: |
          curl -X POST ${{ secrets.BACKEND_URL }}/api/admin/import-results \
            -H "x-import-secret: ${{ secrets.IMPORT_SECRET }}" \
            -H "Content-Type: application/json"

      - name: Keep Render app awake
        run: |
          curl -X GET ${{ secrets.BACKEND_URL }}/api/health
