services:
  - type: web
    name: world-cup-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm ci && npm run build && npx tsx scripts/migrate.ts && npx tsx scripts/seedFixtures.ts
    startCommand: cd backend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: world-cup-db
          property: connectionString
      - key: IMPORT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://world-cup.onrender.com

databases:
  - name: world-cup-db
    plan: free
    region: oregon
