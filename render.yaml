services:
  - type: web
    name: world-cup-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm ci && VITE_API_URL=/api npm run build && cd ../backend && npm ci && npm run build
    startCommand: cd backend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: world-cup-db
          property: connectionString
      - key: IMPORT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

databases:
  - name: world-cup-db
    plan: free
    region: oregon
