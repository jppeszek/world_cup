services:
  - type: web
    name: world-cup-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: world-cup-db
          property: connectionString
      - key: IMPORT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://world-cup-frontend.onrender.com

  - type: static
    name: world-cup-frontend
    staticPublishPath: frontend/dist
    buildCommand: cd frontend && npm install && npm run build
    routes:
      - path: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://world-cup-backend.onrender.com

databases:
  - name: world-cup-db
    plan: free
    region: oregon
